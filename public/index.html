<style>
:root {
  --bg:       #08090b;
  --bg2:      #0f1115;
  --bg3:      #15181e;
  --line:     #1f2229;
  --line2:    #2c3040;
  --txt:      #dde0e8;
  --txt2:     #7c8494;
  --txt3:     #3e4455;
  --gold:     #d4a853;
  --gold-dim: rgba(212,168,83,.1);
  --indigo:   #818cf8; --indigo-bg: rgba(129,140,248,.12);
  --blue:     #60a5fa; --blue-bg:   rgba(96,165,250,.12);
  --amber:    #fbbf24; --amber-bg:  rgba(251,191,36,.12);
  --teal:     #2dd4bf; --teal-bg:   rgba(45,212,191,.12);
  --green:    #86efac; --green-bg:  rgba(134,239,172,.12);
  --fd: 'Lora', Georgia, serif;
  --fb: 'Inter', sans-serif;
}

[data-theme="light"] {
  --bg:       #f5f4f1;
  --bg2:      #ffffff;
  --bg3:      #eeecea;
  --line:     #dddbd7;
  --line2:    #c8c5c0;
  --txt:      #1a1916;
  --txt2:     #5a5752;
  --txt3:     #9a9791;
  --gold:     #9a6c12;
  --gold-dim: rgba(154,108,18,.08);
  --indigo:   #4338ca; --indigo-bg: rgba(67,56,202,.08);
  --blue:     #1d4ed8; --blue-bg:   rgba(29,78,216,.08);
  --amber:    #92400e; --amber-bg:  rgba(146,64,14,.08);
  --teal:     #0f766e; --teal-bg:   rgba(15,118,110,.08);
  --green:    #14532d; --green-bg:  rgba(20,83,45,.08);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--txt);
  font-family: var(--fb);
  font-weight: 400;
  font-size: 16px;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
  transition: background .3s, color .3s;
}

/* ── MASTHEAD ── */
.mast {
  border-bottom: 1px solid var(--line);
  padding: 0 2rem;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  height: 56px;
  position: sticky;
  top: 0;
  background: var(--bg);
  z-index: 100;
  transition: background .3s, border-color .3s;
}

.mast-left {
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: .1rem;
}

.mast-subbrand {
  display: flex;
  align-items: center;
  gap: .35rem;
}

.mast-subbrand-label {
  font-size: 0.62rem;
  color: var(--txt3);
  letter-spacing: .03em;
}

.mast-logo {
  height: 14px;
  width: auto;
}

.brand {
  font-family: var(--fd);
  font-size: 1.35rem;
  font-weight: 600;
  letter-spacing: -.02em;
}
.brand em {
  font-family: 'Lora', Georgia, serif;
  font-style: italic;
  font-weight: 400;
  color: var(--gold);
}

.mast-center {
  text-align: center;
  display: flex;
  flex-direction: column;
  gap: .2rem;
}

.mast-tagline {
  font-size: 0.65rem;
  letter-spacing: .06em;
  color: var(--txt3);
  font-style: italic;
  font-family: var(--fd);
}

.mast-date {
  font-size: 0.65rem;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--txt3);
}

.mast-right {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: .75rem;
}

.theme-btn {
  background: none;
  border: 1px solid var(--line2);
  color: var(--txt2);
  height: 30px;
  padding: 0 .75rem;
  border-radius: 3px;
  cursor: pointer;
  font-family: var(--fb);
  font-size: 0.78rem;
  transition: border-color .15s, color .15s;
}
.theme-btn:hover { border-color: var(--gold); color: var(--gold); }

.live {
  display: flex; align-items: center; gap: .35rem;
  font-size: 0.65rem; letter-spacing: .08em; text-transform: uppercase; color: var(--txt3);
}
.live::before {
  content: ''; width: 6px; height: 6px; border-radius: 50%;
  background: #22c55e; animation: pulse 2s infinite;
}
@keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.3;transform:scale(.7)} }

/* ── TICKER ── */
.ticker {
  background: var(--gold-dim);
  border-bottom: 1px solid var(--line);
  height: 36px; overflow: hidden;
  display: flex; align-items: center;
  transition: background .3s, border-color .3s;
}
.ticker-lbl {
  flex-shrink: 0;
  background: var(--gold); color: var(--bg);
  font-size: 0.7rem; font-weight: 500;
  letter-spacing: .1em; text-transform: uppercase;
  padding: 0 .75rem; height: 100%;
  display: flex; align-items: center;
}
.ticker-wrap { overflow: hidden; flex: 1; }
.ticker-track {
  display: inline-flex; align-items: center;
  white-space: nowrap;
  animation: crawl 120s linear infinite;
  gap: 2rem; padding-left: 1.5rem;
}
.ticker-track:hover { animation-play-state: paused; }
@keyframes crawl { from{transform:translateX(0)} to{transform:translateX(-50%)} }
.ticker-item { font-size: 0.8rem; color: var(--txt2); }
.ticker-item a { color: inherit; text-decoration: none; }
.ticker-item a:hover { color: var(--gold); }
.tick-sep { color: var(--txt3); font-size: 0.65rem; margin: 0 .5rem; }

/* ── LAYOUT ── */
.layout {
  display: grid;
  grid-template-columns: 200px 1fr;
  min-height: calc(100vh - 86px);
}

/* ── SIDEBAR ── */
.sidebar {
  border-right: 1px solid var(--line);
  padding: 1.25rem 0;
  position: sticky;
  top: 56px;
  height: calc(100vh - 56px);
  overflow-y: auto;
  transition: border-color .3s;
}

.s-section { padding: .25rem 1.25rem .9rem; }

.s-label {
  font-size: 0.59rem; letter-spacing: .1em;
  text-transform: uppercase; color: var(--txt3);
  margin-bottom: .6rem; font-weight: 500;
}

.s-list { list-style: none; display: flex; flex-direction: column; gap: .05rem; }

.s-btn {
  width: 100%; text-align: left;
  background: none; border: none;
  font-family: var(--fb); font-size: 0.9rem; font-weight: 400;
  color: var(--txt2); padding: .35rem .55rem;
  border-radius: 3px; cursor: pointer;
  display: flex; align-items: center; justify-content: space-between; gap: .5rem;
  transition: background .12s, color .12s;
}
.s-btn i {
  width: 1.1rem; text-align: center; flex-shrink: 0;
}
.s-btn-label {
  flex: 1;
}
.s-btn:hover { background: var(--bg3); color: var(--txt); }
.s-btn.active { background: var(--gold-dim); color: var(--gold); }

.s-badge {
  font-size: 0.68rem; background: var(--bg3); color: var(--txt3);
  padding: .1rem .4rem; border-radius: 10px; min-width: 20px; text-align: center;
  transition: background .3s, color .3s;
}

.s-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }

.s-divider { height: 1px; background: var(--line); margin: .4rem 0; transition: background .3s; }

.s-stat { padding: .6rem 1.25rem; }
.s-stat .n {
  font-family: var(--fd); font-size: 1.3rem;
  font-weight: 600; color: var(--txt); line-height: 1;
}
.s-stat .l {
  font-size: 0.57rem; color: var(--txt3);
  text-transform: uppercase; letter-spacing: .07em; margin-top: .2rem;
}

/* ── CONTENT ── */
.content { display: flex; flex-direction: column; }

/* ── TOOLBAR ── */
.toolbar {
  border-bottom: 1px solid var(--line);
  padding: .6rem 1.5rem;
  display: flex; align-items: center; justify-content: space-between; gap: 1rem;
  background: var(--bg);
  transition: background .3s, border-color .3s;
}
.toolbar-l { display: flex; align-items: center; gap: .6rem; }

.v-btn {
  background: none; border: 1px solid var(--line2);
  color: var(--txt3); font-family: var(--fb);
  font-size: 0.74rem; padding: .3rem .75rem;
  border-radius: 3px; cursor: pointer;
  display: flex; align-items: center; gap: .35rem;
  transition: all .12s;
}
.v-btn:hover, .v-btn.active { border-color: var(--gold); color: var(--gold); }

.r-count { font-size: 0.7rem; color: var(--txt3); }

.ref-btn {
  background: none; border: 1px solid var(--line2);
  color: var(--txt2); font-family: var(--fb);
  font-size: 0.74rem; padding: .3rem .85rem;
  border-radius: 3px; cursor: pointer;
  display: flex; align-items: center; gap: .35rem;
  transition: all .12s;
}
.ref-btn:hover { border-color: var(--gold); color: var(--gold); }
.ref-btn.spin .icon { display: inline-block; animation: rot .7s linear infinite; }
@keyframes rot { to{transform:rotate(360deg)} }

/* ── NEWS AREA ── */
.news { padding: 1.25rem 1.5rem; flex: 1; }

/* ── GRID ── */
.grid-v {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
  gap: 1px; background: var(--line); border: 1px solid var(--line);
}

/* ── LIST ── */
.list-v { border: 1px solid var(--line); }

/* ── CARD ── */
.card {
  background: var(--bg2); padding: 1.1rem 1.25rem;
  display: flex; flex-direction: column; gap: .6rem;
  transition: background .12s;
  animation: up .25s ease both;
}
.card:hover { background: var(--bg3); }
@keyframes up { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }

.card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: .5rem; }

.tag {
  font-size: 0.62rem; font-weight: 500;
  letter-spacing: .06em; text-transform: uppercase;
  padding: .2rem .5rem; border-radius: 2px; flex-shrink: 0;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  max-width: 108px;
}
.t-indigo{color:var(--indigo);background:var(--indigo-bg)}
.t-blue  {color:var(--blue);  background:var(--blue-bg)}
.t-amber {color:var(--amber); background:var(--amber-bg)}
.t-teal  {color:var(--teal);  background:var(--teal-bg)}
.t-green {color:var(--green); background:var(--green-bg)}
.t-red   {color:#f87171;      background:rgba(248,113,113,.12)}
.t-orange{color:#fb923c;      background:rgba(251,146,60,.12)}
.t-violet{color:#c084fc;      background:rgba(192,132,252,.12)}
.t-slate {color:#94a3b8;      background:rgba(148,163,184,.12)}

.card-age { font-size: 0.78rem; color: var(--txt3); flex-shrink: 0; }

.card-title-link { text-decoration: none; }
.card-title-link:hover .card-title { color: var(--gold); }

.card-title {
  font-family: var(--fd); font-size: 1.05rem;
  font-weight: 600; line-height: 1.45;
  color: var(--txt); letter-spacing: -.01em;
}

.card-desc {
  font-size: 0.9rem; color: var(--txt2);
  line-height: 1.7; flex: 1;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
}

.card-foot {
  display: flex; justify-content: space-between; align-items: center;
  padding-top: .55rem; border-top: 1px solid var(--line);
  transition: border-color .3s;
}

.card-src { font-size: 0.72rem; color: var(--txt3); text-transform: uppercase; letter-spacing: .05em; }

.card-link {
  font-size: 0.82rem; color: var(--gold); text-decoration: none;
  display: flex; align-items: center; gap: .3rem;
  transition: opacity .12s;
}
.card-link:hover { opacity: .7; }
/* ── BOOKMARK ── */
.card-actions { display: flex; justify-content: space-between; align-items: center; padding-top: .5rem; border-top: 1px solid var(--line); transition: border-color .3s; }
.bookmark-btn { background: none; border: none; cursor: pointer; font-size: 0.8rem; color: var(--txt3); font-family: var(--fb); padding: 0; transition: color .15s; display: flex; align-items: center; gap: .3rem; }
.bookmark-btn:hover { color: var(--gold); }
.bookmark-btn.saved { color: var(--gold); }
.saved-badge { display: inline-block; font-size: 0.58rem; font-weight: 500; letter-spacing: .07em; text-transform: uppercase; background: var(--gold-dim); color: var(--gold); padding: .15rem .5rem; border-radius: 2px; margin-left: .4rem; }
.admin-link { font-size: 0.68rem; color: var(--txt3); text-decoration: none; letter-spacing: .03em; transition: color .15s; }
.admin-link:hover { color: var(--gold); }
.footer-tagline { font-size: 0.72rem; font-family: var(--fd); font-style: italic; color: var(--txt3); letter-spacing: .02em; }



.card-insight {
  padding: .7rem .85rem;
  background: var(--bg3); border-radius: 4px;
  transition: background .3s;
}
.card-insight.loading { color: var(--txt3); font-style: italic; font-size: 0.78rem; }
[data-theme="light"] .card-insight { background: #ebe8e2; }
.insight-row { display: flex; align-items: flex-start; gap: 0; margin-bottom: .45rem; }
.insight-row:last-child { margin-bottom: 0; }
.insight-chip {
  flex-shrink: 0; width: 5.5rem;
  font-size: 0.58rem; font-weight: 700; letter-spacing: .07em; text-transform: uppercase;
  padding: .2rem .4rem; border-radius: 3px; white-space: nowrap; line-height: 1.6;
  margin-right: .5rem; margin-top: .05rem; align-self: flex-start;
}
.insight-chip.kern      { background: rgba(212,168,83,.18); color: var(--gold); }
.insight-chip.betekenis { background: rgba(96,165,250,.14); color: var(--blue); }
.insight-chip.actie     { background: rgba(134,239,172,.14); color: var(--green); }
.insight-value { font-size: 0.8rem; color: var(--txt2); line-height: 1.55; flex: 1; min-width: 0; }

/* ── ROW ── */
.row {
  background: var(--bg2); border-bottom: 1px solid var(--line);
  padding: .8rem 1.25rem;
  display: grid; grid-template-columns: 110px 1fr auto;
  align-items: center; gap: 1.25rem;
  transition: background .12s;
  animation: up .2s ease both;
}
.row:last-child { border-bottom: none; }
.row:hover { background: var(--bg3); }
.row-l { display: flex; flex-direction: column; gap: .3rem; align-items: flex-start; min-width: 0; }
.row-title { font-size: 0.95rem; color: var(--txt); line-height: 1.45; min-width: 0; }
.row-src { font-size: 0.72rem; color: var(--txt3); text-transform: uppercase; letter-spacing: .05em; margin-top: .2rem; }

/* ── STATE ── */
.state { padding: 4rem 2rem; text-align: center; color: var(--txt2); }
.ring {
  width: 30px; height: 30px;
  border: 2px solid var(--line2); border-top-color: var(--gold);
  border-radius: 50%; animation: rot .8s linear infinite;
  margin: 0 auto 1rem;
}
.state h3 { font-family: var(--fd); font-size: 1.1rem; font-weight: 700; color: var(--txt); margin-bottom: .4rem; }
.state p { font-size: 0.8rem; }

/* ── FOOTER ── */
footer {
  border-top: 1px solid var(--line);
  padding: .9rem 2rem;
  display: flex; justify-content: flex-end; align-items: center;
  font-size: 0.78rem; color: var(--txt3);
  transition: border-color .3s;
}

.s-collapse-btn {
  width: 100%; text-align: left; background: none; border: none;
  font-family: var(--fb); font-size: 0.7rem; font-weight: 500;
  letter-spacing: .1em; text-transform: uppercase; color: var(--txt3);
  padding: .25rem 1.25rem .5rem; cursor: pointer;
  display: flex; justify-content: space-between; align-items: center;
  transition: color .12s;
}
.s-collapse-btn:hover { color: var(--txt); }
.s-collapse-icon { font-size: 0.7rem; transition: transform .2s; }
.s-collapse-icon.open { transform: rotate(90deg); }
#sources-panel { padding: 0 0 .5rem; }

.s-source-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: .2rem .75rem; gap: .5rem;
}
.s-source-toggle {
  position: relative; width: 28px; height: 16px; flex-shrink: 0;
}
.s-source-toggle input { opacity: 0; width: 0; height: 0; }
.s-source-slider {
  position: absolute; inset: 0; background: var(--line2);
  border-radius: 8px; cursor: pointer; transition: background .2s;
}
.s-source-slider::before {
  content: ''; position: absolute;
  width: 12px; height: 12px; left: 2px; top: 2px;
  background: var(--txt3); border-radius: 50%; transition: all .2s;
}
.s-source-toggle input:checked + .s-source-slider { background: var(--gold); }
.s-source-toggle input:checked + .s-source-slider::before {
  transform: translateX(12px); background: var(--bg);
}
.s-source-name {
  font-size: 0.78rem; color: var(--txt2); flex: 1;
  display: flex; align-items: center; gap: .35rem;
  cursor: pointer;
}
.s-source-name:hover { color: var(--txt); }

.toolbar-sep { width: 1px; height: 16px; background: var(--line2); margin: 0 .25rem; }

/* ── RESPONSIVE ── */
@media (max-width: 720px) {
  /* Header */
  .mast {
    grid-template-columns: 1fr auto;
    padding: 0 1rem;
    height: 52px;
  }
  .mast-center { display: none; }
  .mast-right { gap: .5rem; }
  .mast-subbrand { display: none; }

  /* Layout: sidebar boven content */
  .layout { grid-template-columns: 1fr; }

  /* Sidebar horizontal scrollable pill menu */
  .sidebar {
    position: static;
    height: auto;
    border-right: none;
    border-bottom: 1px solid var(--line);
    padding: .5rem 0;
    overflow-x: auto;
    overflow-y: visible;
    -webkit-overflow-scrolling: touch;
  }
  .s-section {
    display: inline-flex;
    gap: .25rem;
    flex-wrap: nowrap;
    padding: .25rem .75rem;
    white-space: nowrap;
  }
  .s-label { display: none; }
  .s-list { flex-direction: row; flex-wrap: nowrap; gap: .25rem; }
  .s-btn { padding: .25rem .65rem; font-size: 0.78rem; white-space: nowrap; }
  .s-badge { display: none; }
  .s-divider, .s-stat { display: none; }

  /* Toolbar */
  .toolbar { padding: .5rem .75rem; flex-wrap: wrap; gap: .5rem; }
  .r-count { font-size: 0.75rem; }

  /* News grid → single column */

  .grid-v { grid-template-columns: 1fr; }

  /* Cards iets compacter op mobiel */
  .card { padding: 1rem; }
  .card-title { font-size: 0.95rem; }
  .card-desc { -webkit-line-clamp: 2; }

  /* Lijst */
  .row { grid-template-columns: 80px 1fr auto; gap: .75rem; padding: .75rem 1rem; }
  .row-title { font-size: 0.85rem; }

  /* Footer */
  footer { padding: .75rem 1rem; flex-direction: column; gap: .35rem; text-align: center; }

  /* Ticker verbergen op klein scherm */
  .ticker { display: none; }
}

.svg-icon { display: inline-flex; align-items: center; justify-content: center; vertical-align: middle; }
.svg-icon svg { display: block; }
.s-btn .svg-icon { width: 1.1rem; flex-shrink: 0; }
.s-collapse-icon { display: inline-flex; align-items: center; transition: transform .2s; }
.s-collapse-icon.open { transform: rotate(90deg); }

/* Theme button icons */
.icon-sun, .icon-moon { display: inline-flex; align-items: center; }
/* Dark mode: show sun (to switch to light) */
.icon-sun { display: inline-flex; }
.icon-moon { display: none; }
/* Light mode: show moon (to switch to dark) */
[data-theme="light"] .icon-sun { display: none; }
[data-theme="light"] .icon-moon { display: inline-flex; }

      signal: AbortSignal.timeout(10000)
    });

  } catch(e) { return null; }

const esc = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function age(iso) {
  const m = Math.floor((Date.now()-new Date(iso))/60000);
  if(m<1) return 'nu';
  if(m<60) return m+'m';
  if(m<1440) return Math.floor(m/60)+'u';
  return new Date(iso).toLocaleDateString('nl-NL',{day:'numeric',month:'short'});
}

// ── XML PARSER ───────────────────────────────────────────────────
function extractTag(block, tag) {
  const cdata = block.match(new RegExp(`<${tag}[^>]*><!\\[CDATA\\[([\\s\\S]*?)\\]\\]><\\/${tag}>`));
  if (cdata) return cdata[1].trim();
  const plain = block.match(new RegExp(`<${tag}[^>]*>([\\s\\S]*?)<\\/${tag}>`));
  if (plain) return plain[1].replace(/<[^>]*>/g, '').trim();
  return null;
}

function parseXML(xml, feed) {
  const items = [];
  // Ondersteun zowel RSS (<item>) als Atom (<entry>)
  const re = xml.includes('<item>') ? /<item>([\s\S]*?)<\/item>/g : /<entry>([\s\S]*?)<\/entry>/g;
  let m;
  while ((m = re.exec(xml)) !== null) {
    const b = m[1];
    const title = extractTag(b, 'title');
    const link  = extractTag(b, 'link') || extractTag(b, 'guid') ||
                  (b.match(/<link[^>]+href="([^"]+)"/) || [])[1];
    const desc  = extractTag(b, 'description') || extractTag(b, 'summary') || extractTag(b, 'content');
    const date  = extractTag(b, 'pubDate') || extractTag(b, 'published') || extractTag(b, 'updated');
    if (!title || !link) continue;
    const clean = (desc || '').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&nbsp;/g,' ').replace(/&#\d+;/g,'').trim().slice(0, 200);
    items.push({
      title: title.replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&#\d+;/g,'').trim(),
      link: link.trim(),
      description: clean,
      pubDate: date ? new Date(date).toISOString() : new Date().toISOString(),
      source: feed.name, tag: feed.tag, cls: feed.cls, lang: feed.lang
    });
    if (items.length >= 8) break;
  }
  return items;
}

// ── FETCH ────────────────────────────────────────────────────────
async function fetchFeed(feed) {
  try {
    const xml = await fetchFeedRaw(feed.url);
    if (xml) return parseXML(xml, feed);
  } catch(e) {}
  console.warn('Feed mislukt:', feed.name);
  return [];
}

function applyFilter() {

  if(filter==='all')      base=all.filter(i=>!disabledSources.has(i.source));
  else if(filter==='nl')  base=all.filter(i=>i.lang==='nl'&&!disabledSources.has(i.source));

  else if(filter.startsWith('cat:')) {
    const cat = filter.slice(4);

  else if(filter.startsWith('s:')) base=all.filter(i=>i.source===filter.slice(2));
  else base=all.filter(i=>!disabledSources.has(i.source));

  // Sorteren
  if (sortMode === 'popular') {

// ── INSIGHT FORMATTER ───────────────────────────────────────────
function formatInsight(text) {
  if (!text || text === '—' || text.trim() === '') return '';

  const chipMap = {
    'kern':      { cls: 'kern',      label: 'Kern' },
    'betekenis': { cls: 'betekenis', label: 'Betekenis' },
    'actie':     { cls: 'actie',     label: 'Actie' },
  };

  const stripMd = s => s.replace(/\*\*([^*]+)\*\*/g,'$1').replace(/\*([^*]+)\*/g,'$1').replace(/^[•\-\*]\s*/,'').trim();

  const normalizeLabel = s => s
    .replace(/^Relevant\??/i, 'Kern')
    .replace(/^Wat\b/i, 'Kern')
    .replace(/^Conclusie\b/i, 'Betekenis');

  const lines = text.split('\n').map(l => stripMd(l.trim())).filter(Boolean);
  return lines.map(line => {
    const normalized = normalizeLabel(line);
    const match = normalized.match(/^(Kern|Betekenis|Actie)(?:\s*\[[^\]]*\])?:\s*(.*)/i);
    if (match) {
      const key = match[1].toLowerCase();
      const chip = chipMap[key];
      if (chip) {
        return `<div class="insight-row"><span class="insight-chip ${chip.cls}">${chip.label}</span><span class="insight-value">${esc(match[2])}</span></div>`;
      }
    }
    return `<div class="insight-row"><span class="insight-value">${esc(line)}</span></div>`;
  }).join('');
}

// ── BOOKMARKS ────────────────────────────────────────────────────
function getSaved() {
  try { return JSON.parse(localStorage.getItem('bh-saved') || '[]'); } catch(e) { return []; }
}
function setSaved(arr) {
  try { localStorage.setItem('bh-saved', JSON.stringify(arr)); } catch(e) {}
}
function isSaved(link) {
  return getSaved().some(i => i.link === link);
}
function toggleSave(event, link, title, source, cls) {
  event.preventDefault();
  event.stopPropagation();
  const arr = getSaved();
  const idx = arr.findIndex(i => i.link === link);
  if (idx > -1) {
    arr.splice(idx, 1);
  } else {
    arr.unshift({ link, title, source, cls, savedAt: new Date().toISOString() });
  }
  setSaved(arr);
  render(); // re-render to update button state
}

// ── ON-DEMAND ANALYSE ────────────────────────────────────────────
async function fetchInsight(item) {
  try {
    const res = await fetch('/api/analyse', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ link: item.link, title: item.title, description: item.description })
    });
    const data = await res.json();
    return data.insight || null;
  } catch(e) { return null; }
}

async function loadInsightsOnDemand() {
  const cards = document.querySelectorAll('.card[data-link]');
  for (const card of cards) {
    const link = card.getAttribute('data-link');
    const insightEl = card.querySelector('.card-insight');
    if (!insightEl || insightEl.getAttribute('data-loaded') === 'true') continue;
    const item = shown.find(i => i.link === link);
    if (!item) continue;

    // Als analyse al in data zit
    if (item.insight) {
      insightEl.innerHTML = `<span class="insight-label">→</span>${esc(item.insight)}`;
      insightEl.classList.remove('loading');
      insightEl.setAttribute('data-loaded', 'true');
      continue;
    }

    // On-demand ophalen
    insightEl.innerHTML = `<span class="insight-label">→</span><span style="color:var(--txt3);font-size: 0.8rem">Analyse ophalen...</span>`;
    const insight = await fetchInsight(item);
    if (insight) {
      item.insight = insight; // cache in memory
      insightEl.innerHTML = formatInsight(insight) || esc(insight);
    } else {
      insightEl.innerHTML = `<span style="color:var(--txt3);font-size: 0.8rem">Analyse niet beschikbaar.</span>`;
    }
    insightEl.classList.remove('loading');
    insightEl.setAttribute('data-loaded', 'true');
  }
}

// ── SOURCE TOGGLES ───────────────────────────────────────────────
let disabledSources = new Set();
try { disabledSources = new Set(JSON.parse(localStorage.getItem('bh-disabled') || '[]')); } catch(e) {}

function toggleSource(name, enabled) {
  if (enabled) disabledSources.delete(name);
  else disabledSources.add(name);
  try { localStorage.setItem('bh-disabled', JSON.stringify([...disabledSources])); } catch(e) {}
  applyFilter();
  render();
}

function toggleSources() {
  const panel = document.getElementById('sources-panel');
  const icon = document.getElementById('sources-icon');
  const open = panel.style.display === 'none';
  panel.style.display = open ? 'block' : 'none';
  icon.classList.toggle('open', open);
}

// Sync toggles with saved state on load
function syncToggles() {
  document.querySelectorAll('#sources-panel input[type=checkbox]').forEach(cb => {
    const name = cb.getAttribute('onchange').match(/'([^']+)'/)?.[1];
    if (name && disabledSources.has(name)) cb.checked = false;
  });
}

// ── SORT ─────────────────────────────────────────────────────────
let sortMode = 'new';

// Source popularity weights (higher = more authoritative/popular)
const SOURCE_WEIGHT = {
  'McKinsey': 3, 'MIT Sloan': 3, 'MIT Tech Rev': 3, 'Bloomberg Tech': 3,
  'The Verge': 2.5, 'Ars Technica': 2.5, 'VentureBeat': 2,
  'Tweakers': 2, 'Emerce': 2, 'NOS Tech': 2,
  'TLDR AI': 2, 'The Rundown': 2, "Ben's Bites": 2,
};

function getPopularityScore(item) {
  const ageHours = (Date.now() - new Date(item.pubDate)) / 3600000;
  const weight = SOURCE_WEIGHT[item.source] || 1;
  const recency = Math.max(0, 48 - ageHours) / 48; // veroudert na 48u
  return (weight * 2) + (recency * 3);
}

function setSort(mode) {
  sortMode = mode;
  document.getElementById('btn-sort-new').classList.toggle('active', mode === 'new');
  document.getElementById('btn-sort-pop').classList.toggle('active', mode === 'popular');
  applyFilter();
  render();
}

// ── INIT ─────────────────────────────────────────────────────────
let saved; try { saved=localStorage.getItem('bh-theme'); } catch(e){}
applyTheme(saved || 'dark');

document.getElementById('mast-date').textContent =
  new Date().toLocaleDateString('nl-NL',{weekday:'long',day:'numeric',month:'long',year:'numeric'});

syncToggles();
load();
setInterval(load, 15*60*1000);
</script>
