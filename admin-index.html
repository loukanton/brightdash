<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BrightDash — Prompt beheren</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,600;1,400&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#08090b; --bg2:#0f1115; --bg3:#15181e;
  --line:#1f2229; --line2:#2c3040;
  --txt:#dde0e8; --txt2:#7c8494; --txt3:#3e4455;
  --gold:#d4a853; --gold-dim:rgba(212,168,83,.1);
  --fd:'Lora',Georgia,serif; --fb:'Outfit',sans-serif;
}
[data-theme="light"] {
  --bg:#f5f4f1; --bg2:#fff; --bg3:#eeecea;
  --line:#dddbd7; --line2:#c8c5c0;
  --txt:#1a1916; --txt2:#5a5752; --txt3:#9a9791;
  --gold:#9a6c12; --gold-dim:rgba(154,108,18,.08);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:var(--fb);font-weight:400;font-size:16px;min-height:100vh;-webkit-font-smoothing:antialiased}
.mast{border-bottom:1px solid var(--line);padding:0 2rem;display:flex;align-items:center;justify-content:space-between;height:56px;background:var(--bg)}
.brand{font-family:var(--fd);font-size:1.2rem;font-weight:600;letter-spacing:-.02em;text-decoration:none;color:var(--txt)}
.brand em{font-style:italic;font-weight:400;color:var(--gold)}
.back{font-size:.82rem;color:var(--txt2);text-decoration:none;display:flex;align-items:center;gap:.35rem}
.back:hover{color:var(--gold)}
.main{max-width:760px;margin:0 auto;padding:2.5rem 2rem}
h1{font-family:var(--fd);font-size:1.4rem;font-weight:600;margin-bottom:.35rem}
.subtitle{font-size:.85rem;color:var(--txt2);margin-bottom:2rem}
.section{margin-bottom:2rem}
.label{font-size:.72rem;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--txt3);margin-bottom:.6rem;display:block}
textarea{width:100%;background:var(--bg2);border:1px solid var(--line2);color:var(--txt);font-family:var(--fb);font-size:.88rem;line-height:1.7;padding:.85rem 1rem;border-radius:6px;outline:none;resize:vertical;min-height:220px;transition:border-color .15s}
textarea:focus{border-color:var(--gold)}
.test-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem}
input[type=text]{width:100%;background:var(--bg2);border:1px solid var(--line2);color:var(--txt);font-family:var(--fb);font-size:.85rem;padding:.6rem .85rem;border-radius:6px;outline:none;transition:border-color .15s}
input[type=text]:focus{border-color:var(--gold)}
.btn-row{display:flex;gap:.75rem;flex-wrap:wrap}
.btn{font-family:var(--fb);font-size:.85rem;padding:.55rem 1.25rem;border-radius:4px;cursor:pointer;border:1px solid var(--line2);background:none;color:var(--txt2);transition:all .15s}
.btn:hover{border-color:var(--gold);color:var(--gold)}
.btn-primary{background:var(--gold);color:var(--bg);border-color:var(--gold);font-weight:500}
.btn-primary:hover{opacity:.85;color:var(--bg)}
.result-box{background:var(--bg3);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:4px;padding:1rem 1.25rem;font-size:.88rem;line-height:1.7;color:var(--txt2);margin-top:1rem;min-height:60px;display:none}
.result-box.visible{display:block}
.msg{font-size:.82rem;padding:.5rem .85rem;border-radius:4px;margin-top:.75rem;display:none}
.msg.ok{background:rgba(134,239,172,.1);color:#86efac;display:block}
.msg.err{background:rgba(248,113,113,.1);color:#f87171;display:block}
.tip{font-size:.78rem;color:var(--txt3);margin-top:.5rem;line-height:1.6}
.examples{display:grid;grid-template-columns:1fr;gap:.5rem;margin-top:.75rem}
.example-btn{background:var(--bg3);border:1px solid var(--line);color:var(--txt2);font-family:var(--fb);font-size:.78rem;padding:.5rem .85rem;border-radius:4px;cursor:pointer;text-align:left;transition:all .15s}
.example-btn:hover{border-color:var(--gold);color:var(--gold)}
</style>
</head>
<body>
<header class="mast">
  <a href="/" class="brand">Bright<em>Dash</em></a>
  <a href="/" class="back">← Terug naar dashboard</a>
</header>

<main class="main">
  <h1>Prompt beheren</h1>
  <p class="subtitle">Pas de instructie aan die bepaalt hoe analyses worden gegenereerd. Na opslaan worden alle analyses opnieuw gegenereerd.</p>

  <div class="section">
    <label class="label">Analyse-instructie</label>
    <textarea id="prompt" placeholder="Laden..."></textarea>
    <p class="tip">Tip: vermeld wie je bent, wat je doet en wat je wilt weten. Hoe specifieker, hoe relevanter de analyses.</p>
  </div>

  <div class="section">
    <label class="label">Snelle voorbeelden</label>
    <div class="examples">
      <button class="example-btn" onclick="setExample('consultant')">Strategisch consultant — wat kan ik adviseren?</button>
      <button class="example-btn" onclick="setExample('ondernemer')">Ondernemer — kansen voor Bright House</button>
      <button class="example-btn" onclick="setExample('kort')">Supersnel — 1 zin, alleen als het echt relevant is</button>
    </div>
  </div>

  <div class="section">
    <label class="label">Test de prompt</label>
    <div class="test-grid">
      <div>
        <label class="label" style="margin-bottom:.4rem">Artikel titel</label>
        <input type="text" id="test-title" placeholder="Microsoft lanceert Copilot Wave 3..." />
      </div>
      <div>
        <label class="label" style="margin-bottom:.4rem">Korte samenvatting</label>
        <input type="text" id="test-desc" placeholder="Autonome AI-agents in M365..." />
      </div>
    </div>
    <div class="btn-row">
      <button class="btn" onclick="testPrompt()">Test analyse genereren</button>
    </div>
    <div class="result-box" id="test-result"></div>
  </div>

  <div class="btn-row">
    <button class="btn btn-primary" onclick="savePrompt()">Opslaan & analyses vernieuwen</button>
    <button class="btn" onclick="resetPrompt()">Standaard herstellen</button>
  </div>
  <div class="msg" id="msg"></div>
</main>

<script>
const DEFAULT = `Is dit relevant voor een consultant die NL bedrijven en overheden adviseert over digitalisering? Zo ja: schrijf 1 zin wat de consultant ermee kan (max 15 woorden). Zo nee: schrijf alleen een streepje.`;

const EXAMPLES = {
  consultant: `Je bent strategisch adviseur voor een consultant die Nederlandse bedrijven en (semi-)overheden adviseert op het gebied van digitalisering, AI-adoptie en organisatieverandering.

Analyseer dit nieuwsbericht in maximaal 3 bullet points:
• Relevant? Wat is de impact voor NL bedrijven of (semi-)overheid — in 1 zin
• Wat kan een digitaliserings-consultant hiermee adviseren of doen?
• Actie nodig? Alleen vermelden als er urgentie is

Geen inleiding. Geen afsluitende zin. Alleen de bullets die van toepassing zijn.`,

  ondernemer: `Je bent adviseur voor een onafhankelijk consultant in Nederland. Hij zoekt kansen voor nieuwe opdrachten bij bedrijven en overheden die digitaliseren.

Analyseer in maximaal 2 bullets:
• Kans voor een consultant? Welk type klant en welke dienst?
• Concrete actie: wat doe je morgen met dit nieuws?

Alleen als het echt relevant is. Anders: "Niet relevant voor acquisitie."`,

  kort: `Beoordeel in exact 1-2 bullets of dit nieuws relevant is voor een Nederlandse digitaliserings-consultant bij bedrijven of overheid.

• Relevant voor NL klanten? Ja/nee + waarom (max 10 woorden)
• Actie? Alleen als urgent

Niet relevant = schrijf alleen: "Niet relevant."`
};

async function loadPrompt() {
  try {
    const res = await fetch('/api/admin/prompt');
    const data = await res.json();
    document.getElementById('prompt').value = data.prompt || DEFAULT;
  } catch(e) {
    document.getElementById('prompt').value = DEFAULT;
  }
}

function setExample(key) {
  document.getElementById('prompt').value = EXAMPLES[key];
}

function resetPrompt() {
  document.getElementById('prompt').value = DEFAULT;
}

async function savePrompt() {
  const prompt = document.getElementById('prompt').value.trim();
  if (!prompt) return;
  const msg = document.getElementById('msg');
  msg.className = 'msg';
  msg.textContent = 'Opslaan...';
  msg.style.display = 'block';
  try {
    const res = await fetch('/api/admin/prompt', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'save', prompt })
    });
    const data = await res.json();
    if (data.ok) {
      msg.className = 'msg ok';
      msg.textContent = data.message;
    } else {
      msg.className = 'msg err';
      msg.textContent = data.error || 'Fout bij opslaan';
    }
  } catch(e) {
    msg.className = 'msg err';
    msg.textContent = e.message;
  }
}

async function testPrompt() {
  const prompt = document.getElementById('prompt').value.trim();
  const title = document.getElementById('test-title').value.trim();
  const desc = document.getElementById('test-desc').value.trim();
  if (!title) { alert('Voer een testtitel in'); return; }
  const resultBox = document.getElementById('test-result');
  resultBox.textContent = 'Genereren...';
  resultBox.classList.add('visible');
  try {
    const res = await fetch('/api/admin/prompt', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'test', prompt, testTitle: title, testDescription: desc })
    });
    const data = await res.json();
    resultBox.textContent = data.result || data.error || 'Geen resultaat';
  } catch(e) {
    resultBox.textContent = 'Fout: ' + e.message;
  }
}

loadPrompt();
</script>
</body>
</html>
